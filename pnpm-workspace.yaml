packages:
  - 'packages/*'
  - 'apps/*'

# 설치 시 빌드 스크립트 실행을 허용할 패키지 (pnpm 은 기본적으로 모두 차단한다)
allowBuilds:
  esbuild: true

# 워크스페이스 전체가 같은 버전을 쓰도록 고정한다.
# 각 package.json 에서는 "react": "catalog:" 처럼 참조한다.
catalog:
  # 런타임 (peer)
  react: ^18.3.1
  react-dom: ^18.3.1

  # 타입
  '@types/react': ^18.3.31
  '@types/react-dom': ^18.3.7
  '@types/node': ^24.10.1

  # 빌드 / 테스트
  typescript: ^5.9.3
  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.1
  vitest: ^5.0.1
  jsdom: ^30.1.1
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^6.9.1

  # Storybook
  storybook: ^10.6.0
  '@storybook/react-vite': ^10.6.0
  '@storybook/addon-docs': ^10.6.0
  '@storybook/addon-a11y': ^10.6.0

minimumReleaseAgeExclude:
  - html-encoding-sniffer@7.0.0
  - jsdom@30.1.1
  - w3c-xmlserializer@6.0.0

# 설치 시 빌드 스크립트 실행을 허용할 패키지 (pnpm 은 기본적으로 모두 차단한다)
